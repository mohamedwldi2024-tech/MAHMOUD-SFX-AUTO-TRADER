services:
  - type: web
    name: mahmoud-sfx-auto-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
